  description: "Geodynamics, geophysics, numerical modelling, and Underworld3 software development"
  image: assets/img/profile.jpeg
  repo-url: https://github.com/gthyagi/gthyagi.github.io
  search:
    location: navbar
    type: overlay
  back-to-top-navigation: false
