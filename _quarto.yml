format:
  html:
    theme: [default, styles.scss]
    anchor-sections: true
    toc: true
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    link-external-icon: false
    lightbox: true
    include-in-header: "_includes/header.html"

execute:
  freeze: auto
